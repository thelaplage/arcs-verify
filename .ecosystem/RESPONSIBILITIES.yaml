{
  "schema": "https://schemas.arcs.dev/ecosystem/ecosystem.responsibilities.v0.1.schema.json",
  "schema_version": "0.1",
  "repository": "arcs-verify",
  "responsibilities": [
    {
      "id": "verifier_implementation_behavior",
      "summary": "Implement verifier behavior for independently evaluating supplied serialized artifacts.",
      "constitutional_layer": "L6",
      "current_owner": "arcs-verify",
      "candidate_owner": null,
      "candidate_verified": false,
      "migration_authorized": false,
      "relationship": "implements",
      "assertion_status": "validated",
      "evidence_refs": [
        {
          "id": "signed-srs-verifier",
          "path": "arcs_verify/verifier.py",
          "authority": "arcs-verify",
          "relationship": "implements"
        },
        {
          "id": "verifier-boundaries",
          "path": "VERIFICATION_BOUNDARIES.md",
          "authority": "arcs-verify",
          "relationship": "validates"
        }
      ]
    },
    {
