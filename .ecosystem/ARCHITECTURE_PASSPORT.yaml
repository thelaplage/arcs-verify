  "prohibited_dependencies": [
    {
      "id": "verifier-must-not-import-producer-runtime",
      "description": "ARCS Verify must not import DAGR producer or emitter implementation code to verify DAGR receipts.",
      "status": "prohibited",
      "source_layer": "L6",
      "target_layer": "L4",
      "rationale": "Independent verification requires serialized-artifact-only producer boundaries."
    },
    {
      "id": "verifier-must-not-claim-srs-authority",
      "description": "ARCS Verify must not own consumed SRS schema or profile semantics.",
      "status": "prohibited",
      "source_layer": "L6",
      "target_layer": "L1",
      "rationale": "arcs-srs is the consumed SRS schema/profile authority."
    }
  ],
  "dependencies": [
    {
      "repository": "arcs-srs",
      "contract_id": "srs.envelope.schema",
      "reason": "Consumed schema/profile authority represented through vendored pinned bytes."
    },
    {
      "repository": "arcs-ecosystem-kit",
      "contract_id": "ecosystem.declaration.schemas.v0_1",
      "reason": "Validation-only schema dependency; not a runtime package dependency."
    }
  ],
  "extension_points": [
    {
      "id": "additional-pinned-envelope-schema",
      "description": "Additional accepted pinned SRS envelope schemas may be added without weakening existing pins.",
      "status": "declared",
      "owner": "arcs-verify"
    },
    {
      "id": "additional-native-verifier-report-contract",
      "description": "Additional repository-owned verifier-report contracts may be added for downstream consumers.",
      "status": "declared",
      "owner": "arcs-verify"
    }
  ],
  "compatibility_guarantees": [
    {
      "scope": "signed-SRS result semantics",
      "claim_status": "validated",
      "description": "The signed-SRS path keeps eight Boolean results and a separate non-Boolean chain_status."
    },
    {
      "scope": "Amnesiac-chain reserved conclusions",
      "claim_status": "validated",
      "description": "not_evaluated remains distinct from PASS and FAIL."
    }
  ],
  "current_owners": [
    {
      "repository": "arcs-verify",
      "role": "verifier_counterpart",
      "notes": "Owns verifier implementation behavior and native verifier-report outputs."
    }
  ],
  "candidate_owners": [],
  "migration": {
    "authorized": false,
    "record_ref": null,
    "notes": "No ownership migration is authorized by this pilot."
  },
  "security_boundary": {
    "summary": "Serialized artifact verifier boundary: receipt bytes, trust-bundle bytes, pinned schema bytes, selected profile, and optional serialized artifact chain.",
    "trusted_inputs": [
      "pinned local schema bytes",
      "explicitly supplied trust bundle bytes",
      "explicitly supplied serialized evidence artifacts"
    ],
    "protected_assets": [
      "verifier independence",
      "native verifier-report output semantics",
      "source-integrity distinction"
    ],
    "non_authoritative_for": [
      "SRS semantic authority",
      "DAGR runtime behavior",
      "producer truthfulness",
      "underlying event truth",
      "public standard ratification"
    ]
  },
  "non_goals": [
    "Do not change verifier algorithms, profiles, findings, public-release behavior, or CLI result semantics.",
    "Do not certify producer implementations.",
    "Do not prove underlying real-world events occurred.",
    "Do not convert not_evaluated or not_applicable into PASS.",
    "Do not add arcs-ecosystem-kit as a runtime dependency."
  ],
  "conformance": {
    "declared_level": "B",
    "status": "validated",
    "notes": "Verifier-specific projection: independent verification gates validate, while runtime enforcement gates are not applicable."
  },
  "known_exceptions": [
    "AV-001",
    "AV-003"
  ]
