    {
      "id": "result-state-domain-boundary",
      "boundary_type": "schema_ownership",
      "constitutional_layer": "L6",
      "owner_repository": "arcs-verify",
      "description": "ARCS Verify preserves repository-owned result value domains without introducing a generic ecosystem findings ontology.",
      "allowed_imports": [],
      "prohibited_imports": [],
      "authority_refs": [
        "arcs_verify_verifier_implementation"
      ],
      "assertion_status": "validated",
      "evidence_refs": [
        {
          "id": "verification-findings",
          "path": "VERIFICATION_FINDINGS.md",
          "authority": "arcs-verify",
          "relationship": "validates"
        },
        {
          "id": "signed-srs-contract",
          "path": ".ecosystem/CONTRACT_BINDINGS.yaml",
          "authority": "arcs-verify",
          "relationship": "projects"
        }
      ],
      "notes": "Signed-SRS reports have exactly eight Boolean results: schema_digest, envelope, profile, raw_content_exclusion, signature_valid, issuer_key_resolved, issuer_key_trusted, and attestation_limits_present. chain_status is a separate non-Boolean status result; chain_status:not_applicable is not PASS. Amnesiac-chain conclusions are true, false, and not_evaluated; reserved conclusions include authenticity_verified and signature_verified. not_evaluated is not PASS and not necessarily FAIL. Result-state boundaries distinguish emitter_assertion, independently_recomputed_finding, not_evaluated, not_applicable, validation_error, and source_integrity_error. validation_error differs from source_integrity_error; source_integrity_error occurs before reliable evaluation. subject_ref_origin is an emitter assertion, not a verifier verdict. No generic ecosystem findings ontology is introduced."
    }
