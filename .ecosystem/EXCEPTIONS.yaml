      "reason": "arcs-ecosystem-kit is a private repository. tests/test_ecosystem_declarations.py::test_schema_backed_declarations_validate_against_kit_v0_1 now enforces a pinned kit commit (0a0e25674fbe8afca9705d16ca937cb4940969a0) and .github/workflows/test.yml checks that exact commit out into the CI runner (dev/test-only, non-vendored, not a runtime dependency) whenever the ECOSYSTEM_KIT_CHECKOUT_TOKEN repository secret is configured. Until that secret is added, the checkout step is skipped and the test skips with a reason that documents the exact pin instead of faking a pass.",
      "owner": "ARCS Verify maintainers",
