      "created_date": "2026-08-02",
      "affected_conformance_level": "B",
      "mitigation": "Kit-schema conformance runs for real, against the pinned commit, in any environment (local or CI) that provides a checkout of that commit via $ARCS_ECOSYSTEM_KIT_PATH or the local sibling checkout path; a checkout on a different commit is treated as absent and skipped, not silently validated against drifted schemas. CI enforces declaration existence, YAML parseability, and the repository-local boundary/semantics assertions unconditionally in the same test file. Fully closing this exception requires an org/repo admin to provision ECOSYSTEM_KIT_CHECKOUT_TOKEN as a repository secret scoped to read arcs-ecosystem-kit; that provisioning step is outside this repository's code.",
