name: hf-public-surface-d3

on:
  push:
    branches:
      - feat/hf-public-surface0-d3-v0-1
  pull_request:
    paths:
      - "public_artifacts/hf-public-surface/d3-v0.1/**"
      - "tools/materialize_hf_d3_v0_1.py"
      - "tests/test_hf_public_surface_d3.py"
      - ".github/workflows/hf-public-surface-d3.yml"

jobs:
  d3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Require ratified historical fixture pin
        run: git cat-file -e 87ee2d7f223a645a54acda805a22361036102eb4^{commit}
      - name: Test exact-byte D3 materialization
        run: pytest -q tests/test_hf_public_surface_d3.py
      - name: Materialize release candidate
        run: |
          rm -rf /tmp/hf-d3-v0.1
          python tools/materialize_hf_d3_v0_1.py --out /tmp/hf-d3-v0.1
          test -f /tmp/hf-d3-v0.1/DATASET_MANIFEST.json
          test -f /tmp/hf-d3-v0.1/SHA256SUMS.txt
