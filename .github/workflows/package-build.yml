name: package-build

# Non-publishing packaging guard: builds the wheel and sdist, validates the
# metadata, installs the wheel in a clean environment, and runs the minimum
# installed-command smoke. It never publishes: no index upload, no release, no
# tag, and no OIDC (`id-token: write`) permission is requested.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Install the built wheel in a fresh environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
      - name: Installed-command smoke
        run: |
          /tmp/smoke/bin/arcs-verify --help
          /tmp/smoke/bin/python -c "import importlib.metadata as m; print('arcs-verify', m.version('arcs-verify'))"
      - name: Installed-package DAGR report contract smoke
        # Regression guard: the DAGR report/execution-record contract files
        # are runtime package data, not just sdist-grafted files. This
        # exercises validate_verification_report/validate_verification_execution_record
        # and the dagr-report CLI path from the wheel install alone (cwd is
        # outside the checkout so nothing falls back to the source tree),
        # using only the golden fixtures the wheel itself ships.
        working-directory: /tmp
        run: |
          RECEIPT=$(/tmp/smoke/bin/python -c "from arcs_verify import dagr_report as dr; print(dr._CONTRACT_ROOT / 'golden' / 'admission-receipt.json')")
          KEYRING=$(/tmp/smoke/bin/python -c "from arcs_verify import dagr_report as dr; print(dr._CONTRACT_ROOT / 'golden' / 'trust-bundle.json')")
          /tmp/smoke/bin/python -c "
          from arcs_verify import dagr_report as dr
          import json
          golden = dr._CONTRACT_ROOT / 'golden'
          report = json.loads((golden / 'admission-report.json').read_text())
          record = json.loads((golden / 'admission-execution-record.json').read_text())
          assert dr.validate_verification_report(report) == []
          assert dr.validate_verification_execution_record(record) == []
          "
          /tmp/smoke/bin/arcs-verify dagr-report "$RECEIPT" --keyring "$KEYRING" \
            --verifier-commit "$GITHUB_SHA" \
            --execution-id exec:package-build-smoke:0001 \
            --executed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
