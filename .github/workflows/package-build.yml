name: package-build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Focused DAGR authorship verifier proof
        run: pytest -q tests/test_dagr_authority_context_producer.py tests/test_dagr_authority_context_producer_surface.py tests/test_failure_code_registry.py
