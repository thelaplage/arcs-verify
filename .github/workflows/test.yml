name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      # Dev/test-only, non-vendored checkout of the pinned arcs-ecosystem-kit
      # commit (see .ecosystem/EXCEPTIONS.yaml AV-003 and
      # tests/test_ecosystem_declarations.py). arcs-ecosystem-kit is private
      # and never a runtime dependency: without ECOSYSTEM_KIT_CHECKOUT_TOKEN
      # configured as a repository secret, this step is skipped and the
      # kit-schema test below skips with a reason documenting the exact pin,
      # instead of faking a pass.
      - name: Checkout pinned arcs-ecosystem-kit
        if: ${{ secrets.ECOSYSTEM_KIT_CHECKOUT_TOKEN != '' }}
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: thelaplage/arcs-ecosystem-kit
          ref: 0a0e25674fbe8afca9705d16ca937cb4940969a0
          token: ${{ secrets.ECOSYSTEM_KIT_CHECKOUT_TOKEN }}
          path: .ecosystem-kit-pinned
      # Lightweight .ecosystem/ structure check — runs unconditionally without
      # the private arcs-ecosystem-kit.  Verifies all declaration files exist,
      # are valid JSON-compatible YAML, carry the correct repository key, and
      # that RELEASE_STATE.yaml has required fields.  Full schema-backed
      # validation against the kit schemas is handled by pytest below.
      - run: python3 tools/check_ecosystem_structure.py
      - run: pytest -q
        env:
          ARCS_ECOSYSTEM_KIT_PATH: ${{ github.workspace }}/.ecosystem-kit-pinned
      # Public/demo release posture must reject the acknowledged-empty brand
      # waiver. Population remains a separate naming closure item, but a
      # vacuous green release gate is no longer permitted.
      - run: python3 tools/check_public_release.py --require-denylist .
