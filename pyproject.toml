[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcs-verify"
version = "0.1.0"
description = "Independent verifier for signed ARCS/SRS receipt envelopes"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.4,<47",
  "rfc8785==0.1.4",
  "jsonschema>=4.26,<5",
]

[project.scripts]
arcs-verify = "arcs_verify.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["arcs_verify*"]

[tool.setuptools.package-data]
arcs_verify = ["data/*.json"]
